[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "sandheal"
version = "0.1.0"
description = "Proof-driven autonomous CI/CD repair agent."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.10,<3.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.setuptools.packages.find]
include = ["app*"]