name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.12,<1.0"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  runtime-install:
    name: Runtime install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A production install must contain everything the default
      # configuration needs. The application is imported and booted here so
      # that a missing runtime dependency fails the build instead of a
      # deployment.
      - name: Install project without the dev extra
        run: pip install -e .

      - name: Import the application
        run: python -c "import app.main; print(app.main.app.title)"

      - name: Boot the application
        env:
          GITHUB_WEBHOOK_SECRET: ci-runtime-secret
        run: |
          python - <<'PY'
          import asyncio

          from app.main import create_app, lifespan


          async def main() -> None:
              application = create_app()

              async with lifespan(application):
                  print("application booted")


          asyncio.run(main())
          PY
